components:
  schemas:
    ChangePasswordErrorResponse:
      type: object
      description: |-
        Error response body for ``POST /api/v1/auth/change-password/``.

        Returned for incorrect current password (401), mismatched passwords (400),
        weak new password (400), and server errors (500).
      properties:
        success:
          type: boolean
          default: false
          description: Always ``false`` for error responses.
        message:
          type: string
          description: Human-readable description of the error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          default: {}
          description: Field-level validation errors.
      required:
      - message
    ChangePasswordRequestRequest:
      type: object
      description: Request body for ``POST /api/v1/auth/change-password/``.
      properties:
        current_password:
          type: string
          minLength: 1
          description: The user's existing password.
        new_password:
          type: string
          minLength: 1
          description: New password satisfying the enterprise password policy.
        confirm_password:
          type: string
          minLength: 1
          description: Must match ``new_password`` exactly.
      required:
      - confirm_password
      - current_password
      - new_password
    ChangePasswordSuccessResponse:
      type: object
      description: Success response body for ``POST /api/v1/auth/change-password/``.
      properties:
        success:
          type: boolean
          default: true
          description: Indicates whether the request completed successfully.
        message:
          type: string
          default: Password changed successfully.
          description: Human-readable status message.
        data:
          type: object
          additionalProperties: {}
          default: {}
          description: Always an empty object for this endpoint.
    ForgotPasswordErrorResponse:
      type: object
      description: |-
        Error response body for ``POST /api/v1/auth/forgot-password/``.

        Returned for field validation failures (400) and server errors (500).
      properties:
        success:
          type: boolean
          default: false
          description: Always ``false`` for error responses.
        message:
          type: string
          description: Human-readable description of the error.
