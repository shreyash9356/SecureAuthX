          type: object
          additionalProperties:
            type: array
            items:
              type: string
          default: {}
          description: Field-level validation errors.
      required:
      - message
    ForgotPasswordRequestRequest:
      type: object
      description: Request body for ``POST /api/v1/auth/forgot-password/``.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address associated with the account.
      required:
      - email
    ForgotPasswordSuccessResponse:
      type: object
      description: |-
        Success response body for ``POST /api/v1/auth/forgot-password/``.

        Always returned regardless of whether the email exists in the database
