openapi: 3.0.3
info:
  title: SecureAuthX API
  version: 1.0.0
  description: |
    ## Overview

    SecureAuthX is an **enterprise-grade Identity and Access Management (IAM)** platform built with Django REST Framework and React.

    The API provides secure authentication, authorization, user management, role-based access control (RBAC), multi-factor authentication (MFA), audit logging, and session management.

    ## Authentication

    Most endpoints require a valid **JWT Bearer token**. Obtain tokens via `POST /api/v1/auth/login/` and include the access token in the `Authorization` header:

    ```
    Authorization: Bearer <access_token>
    ```

    Access tokens expire after **15 minutes**. Use `POST /api/v1/auth/token/refresh/` to obtain a new access token using your refresh token.

    ## Standards

    - OWASP Top 10
    - OWASP ASVS Level 2
    - NIST SP 800-63B
  contact:
    name: SecureAuthX Team
    email: support@secureauthx.local
  license:
    name: MIT
paths:
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: |-
        Creates a new user account and sends an email verification link to the supplied address.

        **The account cannot be used to log in until the email address is verified.**

        ### Password Policy

        Passwords must satisfy all of the following requirements:

        - Minimum length: **12 characters**
        - At least one **uppercase** letter (A–Z)
        - At least one **lowercase** letter (a–z)
        - At least one **digit** (0–9)
        - At least one **special character** (!@#$%^&* etc.)
        - Must not be a commonly used password
        - Must not be too similar to the email address

        ### Duplicate Email Handling

        If the email is already registered, a `409 Conflict` is returned. No information about the existing account is disclosed.

        ### Security Notes

        - Passwords are hashed with **Argon2id** before storage.
        - The verification token is single-use and expires after **24 hours**.
        - This endpoint does not require authentication.
      summary: Register a new user account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            examples:
              RegistrationRequest:
                value:
                  email: john.doe@example.com
                  username: johndoe
                  first_name: John
                  last_name: Doe
                  password: Str0ng!Passw0rd#2025
                  confirm_password: Str0ng!Passw0rd#2025
                summary: Standard registration with all fields
                description: A complete registration payload including optional profile
                  fields. ``email`` and ``password`` are the only required fields.
                  Passwords must be at least 12 characters and meet the enterprise
                  password policy (uppercase, lowercase, digit, special character).
              MinimalRegistrationRequest:
                value:
                  email: jane.doe@example.com
                  password: Str0ng!Passw0rd#2025
                  confirm_password: Str0ng!Passw0rd#2025
                summary: Registration with required fields only
                description: A minimal registration payload. ``username``, ``first_name``,
                  and ``last_name`` are optional.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSuccessResponse'
              examples:
                RegistrationSuccessful:
                  value:
                    success: true
                    message: Registration successful. Please verify your email.
                    data:
                      user_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      email: john.doe@example.com
                  summary: Account created — email verification required
                  description: Returned when the account is created successfully.
                    The user must verify their email address before they can log in.
          description: Account created. Verification email dispatched.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationErrorResponse'
              examples:
                ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      confirm_password:
                      - Passwords do not match.
                      email:
                      - Enter a valid email address.
                  summary: Request body failed validation
                  description: Returned when one or more fields fail serializer validation,
                    for example when passwords do not match or the email format is
                    invalid.
                WeakPassword:
                  value:
                    success: false
                    message: Password does not meet security requirements.
                    errors: {}
                  summary: Password does not meet the enterprise password policy
                  description: Returned when the supplied password fails the enterprise
                    password policy. Passwords must be at least 12 characters and
                    include uppercase letters, lowercase letters, digits, and special
                    characters.
          description: Request validation failed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationErrorResponse'
              examples:
                DuplicateEmail:
                  value:
                    success: false
                    message: An account with this email already exists.
                    errors: {}
                  summary: An account with this email already exists
                  description: Returned when a registration request uses an email
                    address that is already associated with an existing account. For
                    security, no information about the existing account is disclosed.
          description: An account with this email already exists.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationErrorResponse'
              examples:
                InternalServerError:
                  value:
                    success: false
                    message: Internal server error.
                    errors: {}
                  summary: Unexpected server-side failure
                  description: Returned when an unexpected error occurs during registration.
                    Details are not exposed in production environments.
          description: Unexpected internal server error.
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: |-
        Returns the profile information for the currently authenticated user.

        ### Authentication

        A valid **JWT Bearer token** must be supplied in the `Authorization` header:

        ```
        Authorization: Bearer <access_token>
        ```
      summary: Retrieve the authenticated user's profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccessResponse'
              examples:
                Me—Success:
                  value:
                    success: true
                    message: Profile retrieved successfully.
                    data:
                      id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      email: john.doe@example.com
                      username: johndoe
                      first_name: John
                      last_name: Doe
                      full_name: John Doe
                      is_verified: true
                      is_active: true
                      created_at: '2025-01-15T10:30:00Z'
                  summary: Authenticated user profile retrieved
                  description: Returned when a valid JWT access token is supplied.
                    Contains the full profile of the authenticated user.
          description: Profile retrieved successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeErrorResponse'
              examples:
                Me—Unauthenticated:
                  value:
                    success: false
                    message: Authentication credentials were not provided.
                    errors:
                      detail: Authentication credentials were not provided.
                  summary: No valid JWT token provided
                  description: Returned when the ``Authorization`` header is missing
                    or contains an invalid/expired access token.
          description: No valid JWT token provided.
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Validates the supplied credentials and, on success, issues a short-lived **JWT access token** and a long-lived **JWT refresh token**.

        ### Token Usage

        | Token | Lifetime | Usage |
        |---|---|---|
        | Access token | 15 minutes | `Authorization: Bearer <token>` header |
        | Refresh token | 7 days | `POST /api/v1/auth/token/refresh/` |

        ### Token Storage Recommendations

        - Store the **access token** in memory only (not in `localStorage` or `sessionStorage`) to mitigate XSS risks.
        - Store the **refresh token** in an `HttpOnly`, `Secure`, `SameSite=Strict` cookie to prevent JavaScript access.

        ### Authentication Checks (in order)

        1. Credentials must match a registered account.
        2. The email address must be verified.
        3. The account must be active.
        4. The account must not be locked.

        ### Account Lockout Policy

        After **5 consecutive failed login attempts** the account is automatically locked for **30 minutes**. While locked, even a correct password will be rejected with a 403. The lock lifts automatically — no manual intervention is needed. The failed-attempt counter resets to zero on a successful login.

        A deliberate **generic error message** (`Invalid email or password.`) is returned for credential failures to prevent user enumeration.

        ### Security Notes

        - Email lookup is case-insensitive.
        - Refresh tokens are automatically rotated on each use (`ROTATE_REFRESH_TOKENS = True`).
        - Rotated refresh tokens are blacklisted immediately (`BLACKLIST_AFTER_ROTATION = True`).
        - This endpoint does not require authentication.
      summary: Authenticate and obtain JWT tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                value:
                  email: john.doe@example.com
                  password: Str0ng!Passw0rd#2025
                summary: Authenticate with email and password
                description: Submit valid credentials to receive a JWT access token
                  and refresh token. The email address is case-insensitive.
              ThrottledResponse:
                value:
                  success: false
                  message: Too many requests. Please try again later.
                  errors:
                    retry_after: 42
                summary: Rate limit exceeded
                description: Returned when the client exceeds the configured rate
                  limit.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              examples:
                LoginSuccessful:
                  value:
                    success: true
                    message: Login successful.
                    data:
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiYTFiMmMzZDQtZTVmNi03ODkwLWFiY2QtZWYxMjM0NTY3ODkwIiwiZXhwIjoxNzUyMDAwMDAwfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                      refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiYTFiMmMzZDQtZTVmNi03ODkwLWFiY2QtZWYxMjM0NTY3ODkwIiwidG9rZW5fdHlwZSI6InJlZnJlc2gifQ.dGVzdC1yZWZyZXNoLXRva2Vu
                      user:
                        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        email: john.doe@example.com
                        first_name: John
                        last_name: Doe
                  summary: Authentication succeeded — JWT tokens issued
                  description: Returned when credentials are valid, the email is verified,
                    and the account is active and unlocked. Store the ``access`` token
                    securely (memory only, not localStorage). Store the ``refresh``
                    token in an HttpOnly cookie.
          description: Authentication successful. JWT tokens issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              examples:
                ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      email:
                      - This field is required.
                      password:
                      - This field is required.
                  summary: Request body failed validation
                  description: Returned when the request body is malformed, for example
                    a missing required field or an invalid email format.
          description: Request body failed validation.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              examples:
                InvalidCredentials:
                  value:
                    success: false
                    message: Invalid email or password.
                    errors: {}
                  summary: Email or password is incorrect
                  description: Returned when the email and password combination does
                    not match any account. A deliberately generic message is used
                    to prevent user enumeration attacks.
          description: Invalid email or password.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              examples:
                EmailNotVerified:
                  value:
                    success: false
                    message: Your email address has not been verified.
                    errors: {}
                  summary: Account email address has not been verified
                  description: Returned when the credentials are valid but the user
                    has not yet verified their email address. Direct the user to check
                    their inbox or request a new verification email.
                AccountLocked:
                  value:
                    success: false
                    message: Your account has been locked.
                    errors: {}
                  summary: Account has been locked due to excessive failed attempts
                  description: Returned when the account is locked after exceeding
                    the maximum number of consecutive failed login attempts. The user
                    must contact support to unlock their account.
                AccountInactive:
                  value:
                    success: false
                    message: Your account is inactive. Please contact support.
                    errors: {}
                  summary: Account has been deactivated
                  description: Returned when the account exists but has been deactivated
                    by an administrator.
          description: Access denied — email unverified, account inactive, or account
            locked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledErrorResponse'
              examples:
                ThrottledResponse:
                  value:
                    success: false
                    message: Too many requests. Please try again later.
                    errors:
                      retry_after: 42
                  summary: Rate limit exceeded
                  description: Returned when the client exceeds the configured rate
                    limit.
          description: Returned when the client exceeds the configured rate limit
            for this endpoint.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              examples:
                InternalServerError:
                  value:
                    success: false
                    message: Internal server error.
                    errors: {}
                  summary: Unexpected server-side failure
                  description: Returned when an unexpected error occurs during authentication.
                    Details are not exposed in production environments.
          description: Unexpected internal server error.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: |-
        Invalidates the supplied JWT refresh token by adding it to the Simple JWT blacklist.

        After logout the same refresh token cannot be used to obtain new access tokens. Clients should also discard any locally stored access token after calling this endpoint.
      summary: Logout — blacklist the refresh token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
            examples:
              LogoutRequest:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIs...
                summary: Logout request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
              examples:
                LogoutSuccessful:
                  value:
                    success: true
                    message: Logout successful.
                    data: {}
                  summary: Logout successful
          description: Logout successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutErrorResponse'
              examples:
                InvalidRefreshToken:
                  value:
                    success: false
                    message: Refresh token is invalid or expired.
                    errors: {}
                  summary: Invalid refresh token
          description: Refresh token is invalid or already blacklisted.
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Accepts a valid refresh token and returns a newly issued JWT access token.

        ### Token Rotation

        Refresh tokens are **rotated on every use** (`ROTATE_REFRESH_TOKENS = True`). The old refresh token is immediately blacklisted. Always store the new refresh token returned by `POST /api/v1/auth/login/` or this endpoint.

        Use this endpoint whenever the access token expires (15-minute lifetime).
      summary: Refresh JWT access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
            examples:
              RefreshAccessToken:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: Refresh access token
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
              examples:
                Success:
                  value:
                    success: true
                    message: Access token refreshed successfully.
                    data:
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Access token refreshed successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenErrorResponse'
              examples:
                InvalidRefreshToken:
                  value:
                    success: false
                    message: Refresh token is invalid or expired.
                    errors: {}
                  summary: Invalid refresh token
          description: Refresh token is invalid or expired.
  /api/v1/auth/verify-email/:
    get:
      operationId: api_v1_auth_verify_email_retrieve
      description: |-
        Verifies a user's email address using the signed verification token dispatched during registration.

        ### Flow

        1. User registers → verification email is sent.
        2. User clicks the link → frontend extracts the `token` query parameter.
        3. Frontend calls `GET /api/v1/auth/verify-email/?token=<token>`.
        4. On success the account is activated and the user can log in.

        ### Token Details

        - Signed with Django's `TimestampSigner` — tamper-proof.
        - Expires after **24 hours**.
        - This endpoint does not require authentication.
      summary: Verify email address
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Signed email verification token received in the registration
          email.
        required: true
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailSuccessResponse'
              examples:
                VerifyEmail—Success:
                  value:
                    success: true
                    message: Email verified successfully.
                    data: {}
                  summary: Email verified successfully
                  description: Returned when the signed verification token is valid
                    and the account is now active.
          description: Email verified successfully. Account is now active.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailErrorResponse'
              examples:
                VerifyEmail—MissingToken:
                  value:
                    success: false
                    message: Verification token is required.
                    errors: {}
                  summary: No token query parameter supplied
                  description: Returned when the ``token`` query parameter is absent
                    from the request.
                VerifyEmail—InvalidOrExpiredToken:
                  value:
                    success: false
                    message: Verification link is invalid or has expired.
                    errors: {}
                  summary: Token is tampered with or has exceeded the 24-hour validity
                    window
                  description: Returned when the signed token cannot be verified or
                    has expired. The user must request a new verification email.
          description: Token is missing, invalid, or expired.
  /api/v1/auth/resend-verification/:
    post:
      operationId: api_v1_auth_resend_verification_create
      description: |-
        Generates and sends a new email verification link for an unverified account.

        ### Account Enumeration Prevention

        The same generic success response is always returned regardless of whether the email is registered or already verified — preventing attackers from enumerating valid addresses.

        - This endpoint does not require authentication.
      summary: Resend email verification link
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequestRequest'
            examples:
              ResendVerificationEmail:
                value:
                  email: john@example.com
                summary: Resend verification email
              ThrottledResponse:
                value:
                  success: false
                  message: Too many requests. Please try again later.
                  errors:
                    retry_after: 42
                summary: Rate limit exceeded
                description: Returned when the client exceeds the configured rate
                  limit.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationSuccessResponse'
              examples:
                Success:
                  value:
                    success: true
                    message: If the email exists and is not verified, a verification
                      email has been sent.
                    data: {}
          description: Request processed. Verification email sent if eligible.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationErrorResponse'
              examples:
                ResendVerification—ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      email:
                      - Enter a valid email address.
                  summary: Invalid email format
                  description: Returned when the submitted email fails format validation.
          description: Request body failed field-level validation.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledErrorResponse'
              examples:
                ThrottledResponse:
                  value:
                    success: false
                    message: Too many requests. Please try again later.
                    errors:
                      retry_after: 42
                  summary: Rate limit exceeded
                  description: Returned when the client exceeds the configured rate
                    limit.
          description: Returned when the client exceeds the configured rate limit
            for this endpoint.
  /api/v1/auth/forgot-password/:
    post:
      operationId: api_v1_auth_forgot_password_create
      description: |-
        Accepts an email address and dispatches a password reset link if an active, non-locked account is found.

        ### Account Enumeration Prevention

        The same generic success response is returned regardless of whether the email exists — preventing attackers from enumerating accounts.

        ### Reset Link

        The emailed link embeds a **signed token** that expires after **30 minutes**. Pass this token to `POST /api/v1/auth/reset-password/` to set a new password.

        ### Security Notes

        - Only active, non-locked accounts receive the reset email.
        - Token is signed with Django's `TimestampSigner` — tamper-proof.
        - This endpoint does not require authentication.
      summary: Request a password reset link
      tags:
      - Password Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
            examples:
              ForgotPasswordRequest:
                value:
                  email: john.doe@example.com
                summary: Submit email to receive a password reset link
                description: Submit the email address associated with your account.
                  A reset link will be sent if the account exists. The same generic
                  response is returned whether or not the email is registered — this
                  prevents account enumeration.
              ThrottledResponse:
                value:
                  success: false
                  message: Too many requests. Please try again later.
                  errors:
                    retry_after: 42
                summary: Rate limit exceeded
                description: Returned when the client exceeds the configured rate
                  limit.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordSuccessResponse'
              examples:
                ForgotPassword—Success:
                  value:
                    success: true
                    message: If an account exists, a password reset link has been
                      sent.
                    data: {}
                  summary: Generic success — reset link dispatched (or silently skipped)
                  description: Returned in all cases to prevent leaking whether the
                    email exists.
          description: Request processed. Reset link sent if account exists.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordErrorResponse'
              examples:
                ForgotPassword—ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      email:
                      - Enter a valid email address.
                  summary: Invalid email format
                  description: Returned when the submitted email fails format validation.
          description: Request body failed field-level validation.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledErrorResponse'
              examples:
                ThrottledResponse:
                  value:
                    success: false
                    message: Too many requests. Please try again later.
                    errors:
                      retry_after: 42
                  summary: Rate limit exceeded
                  description: Returned when the client exceeds the configured rate
                    limit.
          description: Returned when the client exceeds the configured rate limit
            for this endpoint.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordErrorResponse'
              examples:
                ForgotPassword—InternalServerError:
                  value:
                    success: false
                    message: Internal server error.
                    errors: {}
                  summary: Unexpected server-side failure
                  description: Details are not exposed in production environments.
          description: Unexpected internal server error.
  /api/v1/auth/reset-password/:
    post:
      operationId: api_v1_auth_reset_password_create
      description: |-
        Consumes the signed token from the password reset email and sets a new password for the associated account.

        ### Token Validity

        - Tokens expire after **30 minutes**.
        - Tokens are cryptographically signed — any tampering renders them invalid.

        ### Password Policy

        The new password must satisfy all enterprise policy requirements:

        - Minimum length: **12 characters**
        - At least one **uppercase** letter (A–Z)
        - At least one **lowercase** letter (a–z)
        - At least one **digit** (0–9)
        - At least one **special character** (!@#$%^&* etc.)
        - Must not be the same as the current password
        - Must not be a commonly used password

        ### Security Notes

        - `password_changed_at` timestamp is updated on success.
        - This endpoint does not require authentication.
      summary: Reset password using a signed token
      tags:
      - Password Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
            examples:
              ResetPasswordRequest:
                value:
                  token: john.doe%40example.com:1sXyZa:abc123...
                  password: NewStr0ng!Passw0rd#2025
                  confirm_password: NewStr0ng!Passw0rd#2025
                summary: Submit token and new password
                description: Submit the signed token received in the reset email together
                  with the desired new password. The token expires after 30 minutes.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccessResponse'
              examples:
                ResetPassword—Success:
                  value:
                    success: true
                    message: Password reset successful.
                    data: {}
                  summary: Password reset successfully
                  description: Returned when the token is valid and the new password
                    passes all policy checks.
          description: Password reset successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordErrorResponse'
              examples:
                ResetPassword—InvalidOrExpiredToken:
                  value:
                    success: false
                    message: Password reset link is invalid or has expired.
                    errors: {}
                  summary: Token is invalid, tampered with, or expired
                  description: Returned when the signed token cannot be verified or
                    has exceeded the 30-minute validity window.
                ResetPassword—PasswordMismatch:
                  value:
                    success: false
                    message: Passwords do not match.
                    errors: {}
                  summary: New password and confirmation do not match
                ResetPassword—WeakPassword:
                  value:
                    success: false
                    message: Password does not meet security requirements.
                    errors: {}
                  summary: New password does not satisfy the enterprise policy
                ResetPassword—ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      token:
                      - This field is required.
                      password:
                      - This field is required.
                  summary: Request body failed field-level validation
          description: Token invalid/expired, passwords do not match, or new password
            fails policy checks.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordErrorResponse'
              examples:
                ResetPassword—InternalServerError:
                  value:
                    success: false
                    message: Internal server error.
                    errors: {}
                  summary: Unexpected server-side failure
          description: Unexpected internal server error.
  /api/v1/auth/change-password/:
    post:
      operationId: api_v1_auth_change_password_create
      description: |-
        Allows an authenticated user to change their own password.

        ### Authentication

        A valid **JWT Bearer token** must be supplied in the `Authorization` header:

        ```
        Authorization: Bearer <access_token>
        ```

        ### Password Policy

        The new password must satisfy all enterprise policy requirements:

        - Minimum length: **12 characters**
        - At least one **uppercase** letter (A–Z)
        - At least one **lowercase** letter (a–z)
        - At least one **digit** (0–9)
        - At least one **special character** (!@#$%^&* etc.)
        - Must not be the same as the current password
        - Must not be a commonly used password

        ### Security Notes

        - `password_changed_at` timestamp is updated on success.
        - A generic error is returned for an incorrect current password to prevent timing-based enumeration.
      summary: Change password (authenticated users only)
      tags:
      - Password Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
            examples:
              ChangePasswordRequest:
                value:
                  current_password: 0ldStr0ng!Passw0rd#2024
                  new_password: NewStr0ng!Passw0rd#2025
                  confirm_password: NewStr0ng!Passw0rd#2025
                summary: Submit current and new password
                description: Requires a valid JWT Bearer token in the ``Authorization``
                  header. The current password is verified before the new password
                  is applied.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
              examples:
                ChangePassword—Success:
                  value:
                    success: true
                    message: Password changed successfully.
                    data: {}
                  summary: Password changed successfully
          description: Password changed successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordErrorResponse'
              examples:
                ChangePassword—PasswordMismatch:
                  value:
                    success: false
                    message: Passwords do not match.
                    errors: {}
                  summary: New password and confirmation do not match
                ChangePassword—WeakPassword:
                  value:
                    success: false
                    message: Password does not meet security requirements.
                    errors: {}
                  summary: New password does not satisfy the enterprise policy
                ChangePassword—ValidationError:
                  value:
                    success: false
                    message: Request validation failed.
                    errors:
                      current_password:
                      - This field is required.
                      new_password:
                      - This field is required.
                  summary: Request body failed field-level validation
          description: Passwords do not match or new password fails policy checks.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordErrorResponse'
              examples:
                ChangePassword—WrongCurrentPassword:
                  value:
                    success: false
                    message: Current password is incorrect.
                    errors: {}
                  summary: The supplied current password is incorrect
                ChangePassword—Unauthenticated:
                  value:
                    success: false
                    message: Authentication credentials were not provided.
                    errors:
                      detail: Authentication credentials were not provided.
                  summary: No valid JWT token provided
          description: No valid JWT token provided, or current password is incorrect.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordErrorResponse'
              examples:
                ChangePassword—InternalServerError:
                  value:
                    success: false
                    message: Internal server error.
                    errors: {}
                  summary: Unexpected server-side failure
          description: Unexpected internal server error.
