          nullable: true
          description: Details about the duties, operational scope, and purpose of
            this role.
        priority:
          type: integer
          readOnly: true
          description: Precedence ranking for administrative priority and resolution
            purposes.
        is_system:
          type: boolean
          readOnly: true
          description: Flag indicating if this is a built-in immutable system role.
        is_active:
          type: boolean
          readOnly: true
          description: Soft-disable flag for administrative revocation without deleting
            database records.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the role was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the role definition was last updated.
      required:
      - created_at
      - description
      - id
      - is_active
      - is_system
      - name
      - priority
      - slug
      - updated_at
    RolePermissionAssignRequest:
      type: object
      description: Serializer to validate mapping payload and assign catalog permission
        capability.
      properties:
        role_id:
          type: string
          format: uuid
        permission_id:
          type: string
          format: uuid
        assignment_reason:
          type: string
          default: ''
      required:
      - permission_id
      - role_id
    RolePermissionRemoveRequest:
      type: object
      description: Serializer to validate and remove permission capability mapping
        from a target role.
      properties:
        role_id:
          type: string
          format: uuid
        permission_id:
          type: string
          format: uuid
      required:
      - permission_id
      - role_id
    RoleUpdateRequest:
      type: object
      description: Serializer to validate payload and invoke RoleService.update_role.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        priority:
          type: integer
          minimum: 0
    StandardErrorEnvelope:
      type: object
      description: Standardized global error wrapper response body.
      properties:
        success:
          type: boolean
          default: false
          description: Always false for error response paths.
        message:
          type: string
          description: Status summary explanation.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          default: {}
          description: Dynamic dictionary mapping fields to error lists, if applicable.
      required:
      - message
    Status2a0Enum:
      enum:
      - PENDING
      - ACTIVE
      - SUSPENDED
      - REMOVED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
        * `REMOVED` - Removed
    Status2fcEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
      - DELETED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `SUSPENDED` - Suspended
        * `DELETED` - Deleted
    ThrottledErrorDetails:
      type: object
      properties:
        retry_after:
          type: integer
          description: The number of seconds to wait before retrying the request.
      required:
      - retry_after
    ThrottledErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
          description: Always ``false`` for throttled error responses.
        message:
          type: string
          default: Too many requests. Please try again later.
          description: Human-readable summary of the error.
        errors:
          $ref: '#/components/schemas/ThrottledErrorDetails'
      required:
      - errors
    UserMinimal:
      type: object
      description: Compact read-only serializer for nested identity profile information.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    UserRoleAssignRequest:
      type: object
      description: Serializer to grant user account role membership access.
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          nullable: true
        assignment_reason:
          type: string
          default: ''
      required:
      - role_id
      - user_id
    UserRoleExtendRequest:
      type: object
      description: Serializer to extend active user role assignment expiration timeline.
      properties:
        assignment_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - assignment_id
      - expires_at
    UserRoleRevokeRequest:
      type: object
      description: Serializer to revoke user account role membership access.
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
      required:
      - role_id
      - user_id
    VerifyEmailErrorResponse:
      type: object
      description: |-
        Error response body for ``GET /api/v1/auth/verify-email/``.

        Returned when the token is missing (400), invalid, or expired (400).
      properties:
        success:
          type: boolean
          default: false
          description: Always ``false`` for error responses.
        message:
          type: string
          description: Human-readable description of the error.
        errors:
          type: object
          additionalProperties: {}
          default: {}
          description: Empty for token errors; reserved for future use.
      required:
      - message
    VerifyEmailSuccessResponse:
      type: object
      description: Success response body for ``GET /api/v1/auth/verify-email/``.
      properties:
        success:
          type: boolean
          default: true
          description: Indicates whether the request completed successfully.
        message:
          type: string
          default: Email verified successfully.
          description: Human-readable status message.
        data:
          type: object
          additionalProperties: {}
          default: {}
          description: Always an empty object for this endpoint.
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Endpoints for registration, login, logout, email verification, and
    token management.
- name: Password Management
  description: Endpoints for forgot password, password reset via token, and changing
    password for authenticated users.
- name: Audit Logs
  description: Read-only audit trail of all security and domain events. Accessible
    by staff (admin) users only.
